name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyQt6>=6.5,<7" pytest pytest-qt pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Test (offscreen, no QApplication popup)
        # 覆盖率门禁待 core/ 抽离完成后于收尾阶段加入（见 REFACTOR_PLAN 阶段 5）
        run: pytest -q

      - name: GUI smoke (main entry, offscreen)
        run: python scripts/verify_gui.py --entry main
