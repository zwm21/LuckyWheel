name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyQt6>=6.5,<7" pytest pytest-qt pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Coverage (core only, gate at 70%)
        # 门禁只覆盖 core/：ui/ 依赖 Qt 事件循环，其正确性由 tests/gui 断言，
        # 行覆盖率数字意义有限。70% 为保守初值，如首轮 CI 实际值显著高于此，
        # 可上调收紧。
        run: pytest -q --cov=src/luckywheel/core --cov-report=term-missing --cov-fail-under=70

      - name: GUI smoke (main entry, offscreen)
        run: python scripts/verify_gui.py --entry main
