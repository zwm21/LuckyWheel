name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # 二进制守卫：exe 改由 GitHub Release 分发，字体不再内置；两者一旦回到
      # 版本控制，pre-commit 的 no-dist-or-fonts 与 check-added-large-files 之外
      # 的路径（如直接 push 到远端）仍可能把大文件带进仓库。注意 bash 默认带
      # -eo pipefail，无命中时 grep 返回 1 会让整条管道失败，故必须用 if 包裹。
      # 后缀集合与 scripts/precommit_no_binaries.py 保持一致（含 otf）。
      - name: "Guard: no tracked binaries (exe/ttf/otf)"
        shell: bash
        run: |
          if git ls-files | grep -E '\.(exe|ttf|otf)$'; then
            echo "::error::仓库中出现了受版本控制的二进制文件（exe/ttf/otf）"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyQt6>=6.5,<7" pytest pytest-qt pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Tests + coverage
        # 门禁按 CI 首轮实测值设定，不凭规划里的数字盲设：整体 80%（panels
        # 的交互分支主要由 tests/gui 覆盖，行覆盖率偏低是预期的），core 94%。
        # 阈值留出余量，防止无关改动把构建弄红。
        run: >-
          pytest -q
          --cov=src/luckywheel/core --cov=src/luckywheel/ui
          --cov-report=term-missing --cov-fail-under=75

      - name: "Gate: core coverage >= 90%"
        # 复用上一步写下的 .coverage，不重跑整套用例。--include 用相对通配是
        # 必须的：数据文件里记的是 src\luckywheel\core\... 这样的平台路径，
        # 带前缀的 *luckywheel/core/* 在 Windows 上匹配不到。模式写错时
        # coverage 打印 "No data to report." 并退出 1，门禁不会静默放过。
        run: python -m coverage report --include="*/core/*" --fail-under=90

      - name: GUI smoke (main entry, offscreen)
        run: python scripts/verify_gui.py --entry main

      - name: GUI smoke (module entry, offscreen)
        run: python scripts/verify_gui.py --entry module
