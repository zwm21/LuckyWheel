[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luckywheel"
version = "2.0.0"
description = "基于 PyQt6 的幸运大转盘抽签程序"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
luckywheel = "luckywheel.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyqt6"  # 环境同时装有 PyQt5/6，须显式指定（插件早于 conftest 读取）
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
# docs/ 是规划文档，其中的代码片段仅为引用示例，不做格式化
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
